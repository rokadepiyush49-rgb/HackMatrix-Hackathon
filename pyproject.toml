[project]
name = "sutra"
version = "0.1.0"
description = "SUTRA — privilege-to-payment intelligence for financial-crime and insider-risk investigation"
requires-python = ">=3.12,<3.13"
dependencies = ["sutra-backend", "kestrel-sim"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "data/kestrel_sim"]

[tool.uv.sources]
sutra-backend = { workspace = true }
kestrel-sim = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "kestrel_sim"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "data/kestrel_sim"]
addopts = "-q"
