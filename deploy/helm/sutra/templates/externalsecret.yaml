{{- if and .Values.externalSecrets.enabled (not .Values.existingSecret) }}
# Secrets never live in Git or in Helm values: External Secrets Operator reads them from
# AWS Secrets Manager (KMS-encrypted, rotated there) and keeps a Kubernetes Secret in sync.
apiVersion: external-secrets.io/v1beta1   # served by the pinned ESO 0.10.x
kind: ExternalSecret
metadata:
  name: {{ include "sutra.fullname" . }}-secrets
  labels: {{- include "sutra.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.secretStore }} }
  target:
    name: {{ include "sutra.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract: { key: {{ .Values.externalSecrets.remoteKey }} }
{{- end }}
