{{- range $role, $name := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "sutra.labels" $ | nindent 4 }}
# AWS permissions are bound by EKS Pod Identity associations (Terraform), not by annotations here.
# The web tier needs no Kubernetes API access at all.
automountServiceAccountToken: false
{{- end }}
