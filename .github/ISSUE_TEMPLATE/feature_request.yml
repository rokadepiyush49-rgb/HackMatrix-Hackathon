name: Feature or detector request
description: A new capability, typology or control
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "Who is affected and what can they not do today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: twin
    attributes:
      label: Suspicious scenario and its legitimate twin
      description: "For detection work: the pattern to catch, and the look-alike that must stay quiet."
