# OpenSSF Scorecard: an external, repeatable grade of this repo's supply-chain hygiene.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4 (image on ghcr.io)
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: results.sarif }
