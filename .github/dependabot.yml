version: 2
updates:
  - { package-ecosystem: uv, directory: "/", schedule: { interval: weekly }, groups: { python: { patterns: ["*"] } } }
  - { package-ecosystem: npm, directory: "/frontend", schedule: { interval: weekly }, groups: { npm: { patterns: ["*"], update-types: [minor, patch] } } }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: "/docker", schedule: { interval: weekly } }
  - { package-ecosystem: terraform, directory: "/infra/terraform/modules/sutra", schedule: { interval: weekly } }
