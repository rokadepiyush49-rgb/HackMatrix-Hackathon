[project]
name = "kestrel-sim"
version = "0.1.0"
description = "Kestrel-Sim: seeded agent-based generator of a fictional urban co-operative bank, with suspicious scenarios and legitimate twins"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_sim"]
