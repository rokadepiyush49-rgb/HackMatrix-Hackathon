[project]
name = "sutra-backend"
version = "0.1.0"
description = "SUTRA API, detection engine (Needle), Alibi, Brief, Mend and copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "orjson>=3.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "rapidfuzz>=3.9",
  "anthropic>=0.40",
  "reportlab>=4.2",
  "slowapi>=0.1.9",
  "kestrel-sim",
]

[project.optional-dependencies]
# Production-only integrations, installed in the container image (`--extra cloud`).
cloud = [
  "anthropic[bedrock]>=1.8",   # SigV4 signing for Claude in Amazon Bedrock
  "boto3>=1.35",
  "redis>=5.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
