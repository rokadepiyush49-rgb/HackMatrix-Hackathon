[project]
name = "sutra-backend"
version = "0.1.0"
description = "SUTRA API, detection engine (Needle), Alibi, Brief, Mend and copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "orjson>=3.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "rapidfuzz>=3.9",
  "anthropic>=0.40",
  "reportlab>=4.2",
  "slowapi>=0.1.9",
  "kestrel-sim",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
